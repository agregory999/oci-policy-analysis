<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCI Policy Analysis - Compartment Hierarchy</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }
      .toolbar input {
        min-width: 280px;
        flex: 1;
      }
      .table-shell {
        border: 1px solid var(--oci-line);
        border-radius: 12px;
        overflow: hidden;
      }
      .table-scroll {
        max-height: 68vh;
        overflow: auto;
      }
      .limit-pill {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .limit-ok {
        background: #dcfce7;
        color: #166534;
      }
      .limit-warning {
        background: #fef9c3;
        color: #854d0e;
      }
      .limit-over {
        background: #fee2e2;
        color: #991b1b;
      }
      .muted {
        color: #6b7280;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Compartment Hierarchy</h1>
      <a href="/">← Back to home</a>
    </header>

    <main>
      <div class="card">
        <p>Review compartment paths and policy statement counts against OCI statement limits.</p>
        <div class="toolbar">
          <input id="searchInput" placeholder="Search path, name, policy count, or statement count" />
          <button id="refreshBtn">Refresh</button>
        </div>
        <div id="summary" class="muted">No data loaded yet.</div>

        <div class="table-shell">
          <div class="table-scroll">
            <table id="rowsTable">
              <thead>
                <tr>
                  <th>Compartment Path / Name</th>
                  <th>Description</th>
                  <th>Policy Count</th>
                  <th>Direct Statements</th>
                  <th>Cumulative from ROOT</th>
                  <th>Limit</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>
      const searchInput = document.getElementById('searchInput');
      const refreshBtn = document.getElementById('refreshBtn');
      const summary = document.getElementById('summary');
      const tableBody = document.querySelector('#rowsTable tbody');

      let allRows = [];

      function rowMatches(row, needle) {
        const hay = [
          row.compartment_name,
          row.hierarchy_path,
          row.compartment_path,
          row.description,
          row.policy_count,
          row.statement_count_direct,
          row.statement_count_cumulative,
          row.limit_state,
        ]
          .join(' ')
          .toLowerCase();
        return hay.includes(needle);
      }

      function limitPill(limitState) {
        const state = String(limitState || 'ok').toLowerCase();
        const cls = state === 'over' ? 'limit-over' : state === 'warning' ? 'limit-warning' : 'limit-ok';
        return `<span class="limit-pill ${cls}">${state}</span>`;
      }

      function renderRows() {
        const needle = String(searchInput.value || '').trim().toLowerCase();
        const rows = needle ? allRows.filter((row) => rowMatches(row, needle)) : allRows;
        tableBody.innerHTML = '';
        if (!rows.length) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="6">No matching rows.</td>';
          tableBody.appendChild(tr);
        } else {
          rows.forEach((row) => {
            const hierarchyPath = row.hierarchy_path || row.compartment_path || '';
            const pathWithName = row.compartment_name ? `${hierarchyPath} (${row.compartment_name})` : hierarchyPath;
            const description = row.description || '(No description)';
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${pathWithName}</td>
              <td>${description}</td>
              <td>${row.policy_count ?? 0}</td>
              <td>${row.statement_count_direct ?? 0}</td>
              <td>${row.statement_count_cumulative ?? 0}</td>
              <td>${limitPill(row.limit_state)}</td>
            `;
            tableBody.appendChild(tr);
          });
        }
        const overCount = rows.filter((row) => String(row.limit_state || '').toLowerCase() === 'over').length;
        const warningCount = rows.filter((row) => String(row.limit_state || '').toLowerCase() === 'warning').length;
        summary.textContent = `Showing ${rows.length} row(s)${needle ? ` (filtered from ${allRows.length})` : ''}. Warning: ${warningCount}, Over: ${overCount}.`;
      }

      async function loadRows() {
        summary.textContent = 'Loading...';
        try {
          const response = await fetch('/utilities/compartment-hierarchy', { cache: 'no-store' });
          const payload = await response.json();
          allRows = Array.isArray(payload.rows) ? payload.rows : [];
          renderRows();
        } catch (err) {
          allRows = [];
          tableBody.innerHTML = '<tr><td colspan="6">Failed to load compartment hierarchy data.</td></tr>';
          summary.textContent = `Load failed: ${err}`;
        }
      }

      searchInput.addEventListener('input', renderRows);
      refreshBtn.addEventListener('click', loadRows);
      loadRows();
    </script>
  </body>
</html>
