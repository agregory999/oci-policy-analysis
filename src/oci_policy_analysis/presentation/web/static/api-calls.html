<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OCI Policy Analysis - API Calls</title><link rel="stylesheet" href="/app.css"></head><body><header class="app-masthead"><h1>API Calls</h1><a href="/logging.html">← Logging</a></header><main class="layout-single"><section class="card"><p>Current server process only, across loads and authorized admin sessions. Metadata only; no request/response bodies. Restarting or clearing discards history.</p><div class="pill-row"><input id="search" placeholder="Search calls, status, reason or request ID"><label><input type="checkbox" id="errors"> Errors only</label><button id="clear">Clear API history</button><span id="status"></span></div><div class="table-scroll" style="max-height:55vh;overflow:auto"><table><thead><tr><th>Started (UTC)</th><th>API Call</th><th>Duration (ms)</th><th>HTTP</th><th>Service Code</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></div><pre id="details" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section></main><script>
const $=id=>document.getElementById(id);let rows=[],selected=null,requestGeneration=0;
function render(){const needle=$('search').value.trim().toLowerCase();const shown=rows.filter(row=>(!$('errors').checked||row.outcome==='Error')&&JSON.stringify(row).toLowerCase().includes(needle));$('rows').replaceChildren();for(const row of shown){const tr=document.createElement('tr');tr.tabIndex=0;for(const key of ['started_at','operation','duration_ms','http_status','code','reason']){const td=tr.insertCell();td.textContent=String(row[key]??'');}const pick=()=>{selected=row.sequence;$('details').textContent=JSON.stringify(row,null,2);};tr.onclick=pick;tr.onkeydown=event=>{if(event.key==='Enter')pick();};$('rows').appendChild(tr);}if(!shown.some(row=>row.sequence===selected)){$('details').textContent='';selected=null;} $('status').textContent=`${shown.length} / ${rows.length} retained calls`;}
async function refresh(){const generation=++requestGeneration;try{const response=await fetch('/logging/api-calls');const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Unable to read API history');if(generation!==requestGeneration)return;rows=payload.rows;render();$('status').textContent+=` · ${payload.dropped} evicted`;}catch(error){$('status').textContent=error.message;}}
$('search').oninput=render;$('errors').onchange=render;$('clear').onclick=async()=>{const response=await fetch('/logging/api-calls/clear',{method:'POST'});if(response.ok)refresh();else $('status').textContent='Unable to clear API history.';};refresh();setInterval(refresh,2000);
</script><script src="/app-version.js"></script><script src="/auth-gate.js"></script></body></html>
