[project]
name = "oci-policy-dg-viewer"
dynamic = ["version"]
description = "OCI Policy and Dynamic Group Viewer"
authors = [{ name = "Andrew Gregory" }]
requires-python = ">=3.11"
dependencies = [
    "oci>=2.28.0",
    "tksheet>=7.0.3",
    "ttkbootstrap>=1.10.1",
    "pyinstaller>=6.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/oci_policy_dg_viewer/_version.py"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C",  # mccabe complexity
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"