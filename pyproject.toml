[project]
name = "oci-policy-analysis"
description = "OCI Policy Analysis"
readme = "README.md"
authors = [{ name = "Andrew Gregory" }]
requires-python = ">=3.12"
license = { text = "UPL-1.0" }
dynamic = ["version"]

dependencies = [
    "oci>=2.28.0",
    "ttkbootstrap>=1.14.2",
    "pyinstaller>=6.1.0",
    "psutil>=7.0.0",
    "deepdiff>=8.6.1",
    "markdown2>=2.5.4",
    "tkhtmlview>=0.3.1",
    "bs4>=0.0.2",
    "uvicorn==0.38.0",
    "fastmcp==2.12.5",
    "mcp==1.16.0",
    "macholib==1.16.3"
]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Universal Permissive License (UPL)",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Tools",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/oci_policy_analysis/_version.py"
write_to_template = "__version__ = '{version}'\n"
fallback_version = "2.2.0"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.semantic_release]
version_toml = []  # do NOT overwrite pyproject.toml
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install build && python -m build"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
major_tags = []
