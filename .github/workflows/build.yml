name: Build and Release OCI Policy Analysis

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Skip release if docs-only commit
        id: skip_release
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == docs:* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping release for docs commit."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.skip_release.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Install Node and semantic-release
        if: steps.skip_release.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: |
          npm install -g semantic-release@22 @semantic-release/changelog@6 @semantic-release/git@10 @semantic-release/github@9 conventional-changelog-conventionalcommits@7 @semantic-release/exec@6
        if: steps.skip_release.outputs.skip != 'true'

      - name: Run semantic-release
        if: steps.skip_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Determine version
        if: steps.skip_release.outputs.skip != 'true'
        id: version
        run: |
          git fetch --tags --force
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-rc."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Skip build if docs-only commit
        id: skip_build
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == docs:* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping build for docs commit."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.skip_build.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Fetch updated tags from release job
        if: steps.skip_build.outputs.skip != 'true'
        run: |
          git fetch --tags --force
          git describe --tags

      - name: Prepare version file
        if: steps.skip_build.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p src/oci_policy_analysis
          echo "$VERSION" > src/oci_policy_analysis/version.txt
          cat src/oci_policy_analysis/version.txt

      - name: Restore pip cache for Linux build
        if: steps.skip_build.outputs.skip != 'true' && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            .cache/pip
            wheels
          key: linux-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            linux-pip-

      - name: Set up Python (macOS/Windows)
        if: steps.skip_build.outputs.skip != 'true' && runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
          architecture: 'x64'

      - name: Build wheels from source (pip)
        if: steps.skip_build.outputs.skip != 'true' && runner.os != 'Linux'
        shell: bash
        run: |
          echo "🐍 Setting up build environment..."
          python -m pip install --upgrade pip

          pip install build wheel pip-tools setuptools pyinstaller==6.14.2 ruff

          echo "🔒 Locking dependencies with pip-compile..."
          pip-compile --generate-hashes --output-file frozen.txt pyproject.toml

          echo "🧹 Removing editable + hash entries..."
          grep -v '^-e .' frozen.txt > deps.txt
          grep -v -- "--hash=" deps.txt > deps2.txt
          mv deps2.txt frozen.txt
          rm deps.txt

          echo "🔨 Building wheels from source..."
          mkdir -p wheels
          pip wheel --no-binary=:all: --only-binary cryptography --only-binary pywin32 --only-binary cython \
            -r frozen.txt -w wheels/

          echo "📥 Installing local source-built wheels..."
          pip install --no-index --find-links=./wheels -r frozen.txt

          echo "📦 Installing your project..."
          pip install -e .

      - name: Linux build inside manylinux2014
        if: steps.skip_build.outputs.skip != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          echo "🐧 Starting Amazon Linux 2 PyInstaller build..."

          export PIP_CACHE_DIR="$PWD/.cache/pip"
          mkdir -p "$PIP_CACHE_DIR" wheels dist build

          # Write the container build script to the workspace so the container can read it
          cat > linux-build.sh <<'AL2'
          set -ex
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          PYTHON_BIN=/opt/python/cp312-cp312/bin/python3.12

          mkdir -p /workspace/.cache/pip
          chmod -R 777 /workspace/.cache

          yum install -y libffi-devel openssl-devel curl

          $PYTHON_BIN -m pip install --upgrade pip
          $PYTHON_BIN -m pip install build wheel pip-tools setuptools pyinstaller==6.14.2 ruff

          echo '🔒 Running pip-compile...'
          $PYTHON_BIN -m piptools compile --generate-hashes --output-file frozen.txt pyproject.toml

          grep -v '^-e .' frozen.txt > deps.txt
          grep -v -- '--hash=' deps.txt > frozen2.txt
          mv frozen2.txt frozen.txt

          # Allow binary wheels (notably cryptography) to avoid heavy native builds
          $PYTHON_BIN -m pip wheel --only-binary cryptography -r frozen.txt -w wheels/

          $PYTHON_BIN -m pip install --no-index --find-links=./wheels -r frozen.txt
          $PYTHON_BIN -m pip install -e .

          PY_SO=$($PYTHON_BIN - <<'PYCODE'
          import sysconfig, glob, os, sys
          prefix = os.path.dirname(os.path.dirname(sys.executable))
          libdir = sysconfig.get_config_var('LIBDIR') or ""
          ldlib = sysconfig.get_config_var('LDLIBRARY') or ""
          patterns = [
              os.path.join(prefix, "lib", "libpython*.so*"),
              os.path.join(prefix, "lib64", "libpython*.so*"),
              os.path.join(libdir, "libpython*.so*"),
              "/usr/lib64/libpython*.so*",
          ]
          if libdir and ldlib:
              patterns.insert(0, os.path.join(libdir, ldlib))
          candidates = []
          for pat in patterns:
              candidates.extend(glob.glob(pat))
          candidates = [c for c in candidates if os.path.isfile(c) and ".a" not in os.path.basename(c)]
          print(candidates[0] if candidates else "")
          PYCODE
          )
          ADD_BIN_ARG=""
          if [ -n "$PY_SO" ]; then
            ADD_BIN_ARG="--add-binary=$PY_SO:."
          else
            echo "⚠️ No libpython shared library found; continuing without --add-binary"
          fi

          echo '📦 Building PyInstaller binary...'
          $PYTHON_BIN -m PyInstaller \
            --name='oci-policy-analysis' \
            --onefile \
            --clean --noconfirm \
            --noconsole \
            --distpath /out \
            --workpath /build \
            --icon=icons/oci-policy-dg-viewer.png \
            --add-data 'src/oci_policy_analysis/version.txt:oci_policy_analysis' \
            --add-data 'src/oci_policy_analysis/logic/permissions:oci_policy_analysis/logic/permissions' \
            --collect-all=sys \
            --copy-metadata fastmcp \
            $ADD_BIN_ARG \
            src/oci_policy_analysis/main.py

          echo '📂 Contents of /out after PyInstaller:'
          ls -lh /out || true
          echo '📂 Contents of /workspace/dist:'
          ls -lh /workspace/dist || true
          AL2
          chmod +x linux-build.sh

          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/dist":/out \
            -v "$PWD/build":/build \
            -w /workspace \
            -e PIP_CACHE_DIR="/workspace/.cache/pip" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /workspace/linux-build.sh

          echo "🎉 Amazon Linux 2 build complete."
          ls -lh dist

      - name: Build package
        if: steps.skip_build.outputs.skip != 'true' && runner.os != 'Linux'
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "🏗️ Building wheel/sdist..."
          mkdir -p src/oci_policy_analysis
          python -m build
          pip install -e .

      - name: Run Ruff check
        if: steps.skip_build.outputs.skip != 'true' && runner.os != 'Linux'
        shell: bash
        run: ruff check src || echo "⚠️ Ruff warnings ignored."

      - name: Derive build version
        if: steps.skip_build.outputs.skip != 'true'
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            git fetch --tags --force
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Inject version into version.txt
        if: steps.skip_build.outputs.skip != 'true'
        run: |
          echo "${{ env.VERSION }}" > src/oci_policy_analysis/version.txt
          cat src/oci_policy_analysis/version.txt

      - name: Build (macOS)
        if: steps.skip_build.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          PY_LIB=$(python3 -c "import sysconfig, glob, os; libdir=sysconfig.get_config_var('LIBDIR'); \
            matches=glob.glob(os.path.join(libdir, 'libpython*.dylib')); print(matches[0] if matches else '')")
          echo "Found Python dylib: $PY_LIB"
          pyinstaller \
            --name="OCI Policy Analysis" \
            --windowed \
            --clean --noconfirm --noconsole \
            --icon=icons/oci-policy-dg-viewer.icns \
            --collect-all=sys \
            --copy-metadata fastmcp \
            --add-data "src/oci_policy_analysis/version.txt:oci_policy_analysis" \
            --add-data "src/oci_policy_analysis/logic/permissions:oci_policy_analysis/logic/permissions" \
            --add-binary="$PY_LIB:Frameworks/Python" \
            src/oci_policy_analysis/main.py

      - name: Build (Windows)
        if: steps.skip_build.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          $pyDll = python -c "import sys, pathlib; base = pathlib.Path(sys.executable).parent; import glob; matches = list(base.glob('python3*.dll')) + list(base.glob('python*.dll')); print(matches[0] if matches else '')"
          Write-Host "Found Python DLL: $pyDll"

          pyinstaller `
            --name "OCI Policy Analysis" `
            --onefile `
            --clean --noconfirm `
            --noconsole `
            --icon "icons\oci-policy-dg-viewer.ico" `
            --collect-all sys `
            --copy-metadata fastmcp `
            --add-data "src\oci_policy_analysis\version.txt;oci_policy_analysis" `
            --add-data "src\oci_policy_analysis\logic\permissions;oci_policy_analysis\logic\permissions" `
            --add-binary "$pyDll;." `
            src\oci_policy_analysis\main.py

      - name: Package artifact
        if: steps.skip_build.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION=${{ needs.release.outputs.version }}
          PLATFORM=${{ matrix.platform }}
          NAME="oci-policy-analysis-${PLATFORM}-${VERSION}"

          echo "📦 Packaging for ${PLATFORM} (version ${VERSION})"
          ls -lh dist

          # Show tree for debugging missing artifacts
          find dist -maxdepth 2 -type f -print

          case "$PLATFORM" in
            macos)
              cd dist
              tar -czf "${NAME}.app.tar.gz" "OCI Policy Analysis.app"
              cd ..
              ;;
            linux)
              cd dist
              BIN=$(ls oci-policy-analysis* 2>/dev/null | head -n 1)
              if [ -z "$BIN" ]; then
                echo "❌ Linux binary not found in dist/"
                ls -la
                exit 1
              fi
              tar -czf "${NAME}.tar.gz" "$BIN"
              cd ..
              ;;
            windows)
              ;;
          esac

          echo "✅ Package step complete."
          ls -lh dist

      - name: Package artifact for Windows
        if: steps.skip_build.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.release.outputs.version }}"
          $PLATFORM = "${{ matrix.platform }}"
          $NAME = "oci-policy-analysis-${PLATFORM}-${VERSION}"
          Compress-Archive -Path "dist/OCI Policy Analysis.exe" -Destination dist/${NAME}.zip -Force
          dir dist

      - name: Upload artifact
        if: steps.skip_build.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oci-policy-analysis-${{ matrix.platform }}
          path: |
            dist/oci-policy-analysis-*.tar.gz
            dist/oci-policy-analysis-*.zip
          retention-days: 30

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Skip publish if docs-only commit
        id: skip_publish
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == docs:* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping publish for docs commit."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.skip_publish.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: steps.skip_publish.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show collected artifacts
        if: steps.skip_publish.outputs.skip != 'true'
        run: ls -lhR dist

      - name: Create GitHub Release
        if: steps.skip_publish.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            dist/oci-policy-analysis-linux/oci-policy-analysis-linux-${{ needs.release.outputs.version }}.tar.gz
            dist/oci-policy-analysis-macos/oci-policy-analysis-macos-${{ needs.release.outputs.version }}.app.tar.gz
            dist/oci-policy-analysis-windows/oci-policy-analysis-windows-${{ needs.release.outputs.version }}.zip
          draft: false
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
