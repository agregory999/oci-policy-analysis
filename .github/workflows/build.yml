name: Build and Release OCI Policy DG Viewer

on:
  push:
    branches:
      - main
      - feature/tkinter-enhanced
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release>=10.3.0 toml build

      - name: Create src/oci_policy_dg_viewer directory
        run: mkdir -p src/oci_policy_dg_viewer

      - name: Initialize CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo -e "# Changelog\n\nAll notable changes to this project will be documented in this file.\n" > CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "chore: initialize CHANGELOG.md [skip ci]"
          fi

      - name: Debug semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing tags:"
          git tag -l
          echo "Recent commits:"
          git log --oneline -n 5
          echo "Current CHANGELOG.md:"
          cat CHANGELOG.md
          semantic-release -vv version --noop || echo "Dry run failed"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version 2> semantic-release-error.log || {
            echo "semantic-release failed:"
            cat semantic-release-error.log
            if grep -q "429 Too Many Requests" semantic-release-error.log; then
              echo "Rate limit hit, retrying after 60 seconds..."
              sleep 60
              semantic-release -vv version || {
                echo "Retry failed:"
                cat semantic-release-error.log
                exit 1
              }
            else
              exit 1
            fi
          }

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import subprocess; tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip(); print(tag.lstrip('v'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload versioned pyproject.toml
        uses: actions/upload-artifact@v4
        with:
          name: pyproject-toml
          path: pyproject.toml
          retention-days: 30

  build:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tkinter (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools>=61.0 wheel setuptools_scm>=8

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import subprocess; tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip(); print(tag.lstrip('v'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        if: matrix.os != 'windows-latest'

      - name: Get version (Windows)
        id: get_version_windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $VERSION = $(python -c "import subprocess; tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip(); print(tag.lstrip('v'))")
          echo "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.VERSION }}
        run: |
          python -m build
          pip install -e .

      - name: Install PyInstaller
        run: pip install pyinstaller>=6.1.0

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            pyinstaller --name oci-policy-dg-viewer-macos-${{ env.VERSION }} \
                        --icon icons/oci-policy-dg-viewer.icns \
                        --windowed \
                        --clean \
                        --noconfirm \
                        --osx-bundle-identifier com.example.oci-policy-dg-viewer \
                        src/oci_policy_dg_viewer.py
          else
            pyinstaller --name oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}-${{ env.VERSION }} \
                        --icon ${{ matrix.os == 'windows-latest' && 'icons/oci-policy-dg-viewer.ico' || 'icons/oci-policy-dg-viewer.png' }} \
                        --onefile \
                        --clean \
                        --noconfirm \
                        src/oci_policy_dg_viewer.py
          fi

      - name: Archive macOS executable
        if: matrix.os == 'macos-latest'
        run: |
          tar -C dist -czf dist/oci-policy-dg-viewer-macos-${{ env.VERSION }}.app.tar.gz oci-policy-dg-viewer-macos-${{ env.VERSION }}.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}-${{ env.VERSION }}
          path: |
            dist/oci-policy-dg-viewer-${{ matrix.os == 'macos-latest' && 'macos-' || matrix.os == 'ubuntu-latest' && 'linux-' || 'windows-' }}${{ env.VERSION }}${{ matrix.os == 'macos-latest' && '.app.tar.gz' || matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 30

  collect-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import subprocess; tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0']).decode().strip(); print(tag.lstrip('v'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: oci-policy-dg-viewer-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/oci-policy-dg-viewer-linux-${{ env.VERSION }}
            dist/oci-policy-dg-viewer-macos-${{ env.VERSION }}.app.tar.gz
            dist/oci-policy-dg-viewer-windows-${{ env.VERSION }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}