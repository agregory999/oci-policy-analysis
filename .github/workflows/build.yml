```yaml
name: Build OCI Policy DG Viewer

on:
  push:
    branches:
      - main
      - v2feature
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.11'
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tkinter (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.1.0

      - name: Build executable
        run: |
          pyinstaller --name oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }} \
                      --add-data "src/oci_policy_dg_core.py${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
                      --clean \
                      --noconfirm \
                      src/oci_policy_dg_viewer.py

      - name: Move executable to dist/
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv dist/oci-policy-dg-viewer-windows/oci-policy-dg-viewer-windows.exe dist/
          else
            mv dist/oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}/oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }} dist/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}
          path: dist/oci-policy-dg-viewer-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}*
          retention-days: 7