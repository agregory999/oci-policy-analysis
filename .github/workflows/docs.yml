name: Build and Deploy Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U sphinx sphinx_rtd_theme myst-parser sphinxcontrib-mermaid

      - name: Build documentation
        run: sphinx-build -b html docs/source docs/build/html

      - name: Ensure GitHub Pages site exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking if Pages site exists..."
          resp=$(curl -s -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      https://api.github.com/repos/${REPO}/pages)
          if echo "$resp" | grep -q "not been enabled"; then
            echo "Pages not enabled — creating..."
            curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                https://api.github.com/repos/${REPO}/pages \
                -d '{"source":{"branch":"gh-pages","path":"/"}}'
          else
            echo "Pages site already exists."
          fi


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
