name: Build OCI Policy DG Viewer Flet

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install oci flet pyinstaller

      - name: Pack Flet app for ${{ matrix.os }}
        working-directory: src/oci_policy_dg_viewer/flet_ui
        run: |
          flet pack main.py --name oci_policy_dg_viewer_flet --distpath dist/${{ matrix.os }} --product-name "OCI Policy DG Viewer" --product-version "1.0.0" --company-name "Your Company" --copyright "Copyright (c) 2025 Your Company" --icon icon.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: src/oci_policy_dg_viewer/flet_ui/dist/${{ matrix.os }}