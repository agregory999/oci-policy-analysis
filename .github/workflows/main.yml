name: Build OCI Policy DG Viewer

on:
  push:
    branches:
      - main
      - v2feature
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.11'  # Matches requires-python in pyproject.toml
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install PyInstaller
        run: |
          pip install pyinstaller>=6.1.0

      - name: Build executable
        run: |
          pyinstaller --name oci-policy-dg-viewer-${{ matrix.os }} \
                      --add-data "src/oci_policy_dg_core.py${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
                      --clean \
                      --noconfirm \
                      src/oci_policy_dg_viewer.py

      - name: Move executable to dist/
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv dist/oci-policy-dg-viewer-${{ matrix.os }}/oci-policy-dg-viewer-${{ matrix.os }}.exe dist/
          else
            mv dist/oci-policy-dg-viewer-${{ matrix.os }}/oci-policy-dg-viewer-${{ matrix.os }} dist/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oci-policy-dg-viewer-${{ matrix.os }}
          path: dist/oci-policy-dg-viewer-${{ matrix.os }}*
          retention-days: 7
